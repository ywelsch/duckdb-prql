#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: prql
      extra_toolchains: 'rust'
      exclude_archs: 'linux_amd64_musl'

  # The distribution pipeline only builds the wasm extensions, so run the SQL logic tests against the
  # wasm_eh build in DuckDB-Wasm in a headless browser.
  duckdb-stable-wasm-test:
    name: Test wasm_eh in browser
    needs: duckdb-stable-build
    runs-on: ubuntu-latest
    env:
      # Must be built from the same DuckDB commit as the extension (v2.0.0 = d54cbbe3df).
      DUCKDB_WASM_VERSION: 1.33.1-dev110.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prql-v2.0.0-extension-wasm_eh
          path: build/wasm_eh

      - name: Download DuckDB-Wasm
        run: |
          npm pack --loglevel=warn "@duckdb/duckdb-wasm@${DUCKDB_WASM_VERSION}" --pack-destination build
          tar -xzf "build/duckdb-duckdb-wasm-${DUCKDB_WASM_VERSION}.tgz" -C build

      - name: Test
        run: node test/wasm/run.mjs --extension build/wasm_eh/prql.duckdb_extension.wasm --duckdb-wasm build/package/dist

  duckdb-stable-deploy:
    name: Deploy extension binaries
    if: false
    needs: duckdb-stable-build
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      extension_name: prql
      duckdb_version: v2.0.0
      exclude_archs: 'linux_amd64_musl'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}